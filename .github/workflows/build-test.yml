name: V6 production build and verify

on:
  push:
    branches: [main, v6-production-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm install --ignore-scripts
      - name: Build production assets
        run: npm run build
      - name: Verify production output
        run: |
          test -f dist/index.html
          test -f dist/assets/app.js
          test -f dist/assets/app.css
          ! grep -q '@babel/standalone' dist/index.html
          ! grep -q 'cdn.tailwindcss.com' dist/index.html
          ! grep -q 'unsafe-eval' dist/index.html
      - name: Promote compiled assets on build branch
        run: |
          mkdir -p src
          if [ ! -f src/index.source.html ]; then cp index.html src/index.source.html; fi
          rm -rf assets
          cp -R dist/assets assets
          cp dist/index.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets src/index.source.html package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Build production assets [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ukom-health-pro-production-build
          path: |
            dist
            package-lock.json
