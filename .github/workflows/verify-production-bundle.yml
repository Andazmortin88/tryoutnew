name: Build production bundle

on:
  push:
    branches: [v6-production-bundle]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install exact dependencies
        run: npm install --no-audit --no-fund
      - name: Build compiled production bundle
        run: npm run build
      - name: Publish compiled assets to branch
        run: |
          rm -rf assets
          cp -R dist/assets ./assets
          cp dist/index.html ./index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json index.html assets
          if git diff --cached --quiet; then
            echo "No compiled changes"
          else
            git commit -m "Build locked production bundle"
            git push
          fi
