name: Verify production bundle

on:
  push:
    branches: [v6-production-bundle]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install exact dependencies
        run: npm install --no-audit --no-fund
      - name: Build compiled production bundle
        run: npm run build
      - name: Upload compiled bundle
        uses: actions/upload-artifact@v4
        with:
          name: ukom-production-bundle
          path: |
            dist
            package-lock.json
