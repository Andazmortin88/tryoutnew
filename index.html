function load(key, fallback){ try { const v=localStorage.getItem(key); return v?JSON.parse(v):fallback; } catch { return fallback; } }
function save(key, value){ localStorage.setItem(key, JSON.stringify(value)); }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function prepareQuestion(q, randomize=true){
  if(!randomize) return {...q, optionMap:[0,1,2,3,4]};
  const pairs=q.options.map((text,originalIndex)=>({text,originalIndex}));
  const randomized=shuffle(pairs);
  return {...q, options:randomized.map(x=>x.text), optionMap:randomized.map(x=>x.originalIndex), correctAnswer:randomized.findIndex(x=>x.originalIndex===q.correctAnswer)};
}
function fmtTime(sec){ const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60; return `${h?String(h).padStart(2,'0')+':':''}${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }
function readiness(score){
  if(score>=75) return {label:'Kesiapan Tinggi',tone:'emerald',message:'Pertahankan konsistensi dan fokuskan latihan pada area terlemah.'};
  if(score>=60) return {label:'Kesiapan Sedang',tone:'amber',message:'Dasar sudah cukup, tetapi masih ada area yang perlu penguatan terarah.'};
  return {label:'Perlu Penguatan',tone:'rose',message:'Prioritaskan latihan per rumpun dan ulangi soal yang masih salah.'};
}
function calcAttempt(questions, answers, startedAt, mode){
  let correct=0; const byArea={}; const wrongIds=[];
  questions.forEach((q,i)=>{
    const a=answers[i]; const ok=a===q.correctAnswer; if(ok) correct++; else if(a!==undefined) wrongIds.push(q.id);
    byArea[q.rumpun] ||= {total:0,correct:0,answered:0};
    byArea[q.rumpun].total++; if(a!==undefined) byArea[q.rumpun].answered++; if(ok) byArea[q.rumpun].correct++;
  });
  const score=questions.length?+(100*correct/questions.length).toFixed(1):0;
  return { id:crypto.randomUUID?crypto.randomUUID():String(Date.now()), createdAt:new Date().toISOString(), startedAt, mode, score, correct, total:questions.length, answered:Object.keys(answers).length, byArea, wrongIds };
}
function average(xs){ return xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:0; }

  function dbRowToAttempt(row){

    return {
      id:row.id,
      createdAt:row.finished_at||row.started_at,
      startedAt:row.started_at,
      mode:row.mode,
      score:Number(row.score||0),
      correct:Number(m.correct||0),
      total:Number(row.total_questions||0),
      answered:Number(m.answered||0),
      byArea:m.byArea||{},
      wrongIds:m.wrongIds||[]
    };
  }

  async function loadCloudProgress(userId){
    if(!AUTH_CONFIGURED || !userId) return;
    try{
      const {data:attemptRows,error:attemptErr}=await supabaseClient
        .from('attempts')
        .select('id,user_id,mode,started_at,finished_at,score,total_questions,metadata')
        .eq('user_id',userId)
        .order('finished_at',{ascending:false})
        .limit(100);
      if(attemptErr) throw attemptErr;
      const cloudAttempts=(attemptRows||[]).map(dbRowToAttempt);
      setAttempts(cloudAttempts);

      // Rekonstruksi "soal salah saya" berdasarkan jawaban paling baru per soal.
      const {data:answerRows,error:answerErr}=await supabaseClient
        .from('attempt_answers')
        .select('question_id,is_correct,answered_at')
        .order('answered_at',{ascending:true});
      if(!answerErr && answerRows){
        const wrong=new Set();
        answerRows.forEach(r=>{
          if(r.is_correct===true) wrong.delete(r.question_id);
          else if(r.is_correct===false) wrong.add(r.question_id);
        });
        setWrongIds([...wrong]);
      }
      setAuthMessage('Progres tersinkron dengan Supabase.');
    }catch(err){
      console.error('loadCloudProgress',err);
      setAuthMessage('Login berhasil, tetapi riwayat cloud belum dapat dimuat: '+(err.message||err));
    }
  }

  async function saveAttemptToCloud(attempt, examSession){
    if(!AUTH_CONFIGURED || !authUser?.id) return {ok:false,localOnly:true};
    const finishedAt=attempt.createdAt||new Date().toISOString();
    const attemptPayload={
      id:attempt.id,
      user_id:authUser.id,
      mode:attempt.mode,
      started_at:attempt.startedAt,
      finished_at:finishedAt,
      score:attempt.score,
      total_questions:attempt.total,
      metadata:{
        correct:attempt.correct,
        answered:attempt.answered,
        byArea:attempt.byArea,
        wrongIds:attempt.wrongIds,
        appVersion:'2.2'
      }
    };

    const {error:attemptErr}=await supabaseClient.from('attempts').insert(attemptPayload);
    if(attemptErr) throw attemptErr;

    const answerRows=examSession.questions.map((q,i)=>({
      attempt_id:attempt.id,
      question_id:Number(q.id),
      selected_option:examSession.answers[i]===undefined ? null : Number((q.optionMap||[0,1,2,3,4])[examSession.answers[i]]),
      is_correct:examSession.answers[i]===undefined ? false : examSession.answers[i]===q.correctAnswer,
      is_flagged:(examSession.flagged||[]).includes(i),
      answered_at:finishedAt
    }));

    const {error:answersErr}=await supabaseClient.from('attempt_answers').insert(answerRows);
    if(answersErr){
      // Ringkasan attempt tetap aman tersimpan. Error paling umum pada tahap ini adalah
      // question_id belum ada di tabel questions (FK 23503).
      console.error('attempt_answers insert',answersErr);
      return {ok:true,answersSaved:false,error:answersErr};
    }
    return {ok:true,answersSaved:true};
  }

  async function clearCloudHistory(){
    if(!AUTH_CONFIGURED || !authUser?.id) return;
    if(!confirm('Hapus seluruh riwayat tryout Anda dari Supabase? Tindakan ini tidak dapat dibatalkan.')) return;
    const {error}=await supabaseClient.from('attempts').delete().eq('user_id',authUser.id);
    if(error){ alert('Gagal menghapus riwayat: '+error.message); return; }
    setAttempts([]); setWrongIds([]);
    setAuthMessage('Riwayat cloud berhasil dihapus.');
  }

  function updateSession(nextOrUpdater){
    setSession(prev=>{
      const next=typeof nextOrUpdater==='function'?nextOrUpdater(prev):nextOrUpdater;
      if(next) save(STORAGE.SESSION,next);
      return next;
    });
  }


  const latest=attempts[0];
  const avg=+average(attempts.map(a=>a.score)).toFixed(1);
  const best=attempts.length?Math.max(...attempts.map(a=>a.score)):0;
  const aggregate=useMemo(()=>{
    const data={}; AREAS.forEach(a=>data[a]={correct:0,total:0});
    attempts.slice(0,10).forEach(at=>Object.entries(at.byArea||{}).forEach(([area,v])=>{ data[area]||={correct:0,total:0}; data[area].correct+=v.correct; data[area].total+=v.total; }));
    return data;
  },[attempts]);
  const weakest=Object.entries(aggregate).filter(([,v])=>v.total>0).sort((a,b)=>(a[1].correct/a[1].total)-(b[1].correct/b[1].total))[0]?.[0];

  function startSession(custom=setup){
    let pool=SEED_QUESTIONS;
    if(custom.mode==='wrong') pool=SEED_QUESTIONS.filter(q=>wrongIds.includes(q.id));
    else if(custom.area!=='Semua') pool=pool.filter(q=>q.rumpun===custom.area);
    if(!pool.length){ alert('Belum ada soal pada pilihan ini.'); return; }
    const count=custom.mode==='tryout'?Math.min(180,pool.length):Math.min(+custom.count||20,pool.length);
    const picked=shuffle(pool).slice(0,count).map(q=>prepareQuestion(q,custom.randomize!==false));
    const s={
      id:Date.now(), mode:custom.mode, area:custom.area, questions:picked, answers:{}, flagged:[], current:0,
      startedAt:new Date().toISOString(), timeLeft: custom.mode==='tryout'?count*60:null, reveal:{}, tutorOpen:null
    };
    setSession(s); save(STORAGE.SESSION,s); setView('exam');
  }
  function resumeSession(){ const s=load(STORAGE.SESSION,null); if(s){setSession(s);setView('exam');} }
  async function finishSession(){
    if(!session) return;
    const a=calcAttempt(session.questions,session.answers,session.startedAt,session.mode);

    // Optimistic UI: hasil langsung tampil, cloud sync berjalan sebelum pindah result.
    const next=[a,...attempts].filter((x,i,arr)=>arr.findIndex(y=>y.id===x.id)===i).slice(0,100);
    setAttempts(next);
    const newWrong=new Set(wrongIds);
    session.questions.forEach((q,i)=>{
      if(session.answers[i]===q.correctAnswer) newWrong.delete(q.id);
      else if(session.answers[i]!==undefined) newWrong.add(q.id);
    });
    setWrongIds([...newWrong]);

    if(AUTH_CONFIGURED && authUser?.id){
      try{
        setAuthMessage('Menyimpan hasil tryout ke Supabase…');
        const cloud=await saveAttemptToCloud(a,session);
        if(cloud.answersSaved===false){
          setAuthMessage('Nilai sudah tersimpan di Supabase. Detail jawaban belum tersimpan karena bank soal di tabel questions belum sinkron dengan ID soal aplikasi.');
        }else{
          setAuthMessage('Nilai dan seluruh jawaban berhasil tersimpan di Supabase.');
        }
      }catch(err){
        console.error('saveAttemptToCloud',err);
        setAuthMessage('Hasil tetap tersimpan lokal, tetapi sinkronisasi Supabase gagal: '+(err.message||err));
      }
    }

    localStorage.removeItem(STORAGE.SESSION);
    setLastAttempt({...a,questions:session.questions,answers:session.answers,flagged:session.flagged});
    setView('result');
  }

  if(authLoading) return <div className="min-h-screen grid place-items-center bg-slate-950 text-white"><div className="text-center"><div className="w-14 h-14 rounded-2xl bg-indigo-500 grid place-items-center font-black text-2xl mx-auto">N</div><div className="font-black mt-4">Memuat UKOM Ners Pro AI…</div></div></div>;
  if(!authUser) return <AuthGate onGoogle={()=>googleOAuth()} authConfigured={AUTH_CONFIGURED} message={authMessage}/>;

  return <div className="min-h-screen text-slate-800">
    {view!=='exam' && <TopNav view={view} setView={setView} profile={profile} authUser={authUser} onSignOut={signOut}/>} 
    {view==='dashboard' && <Dashboard profile={profile} attempts={attempts} avg={avg} best={best} latest={latest} aggregate={aggregate} weakest={weakest} wrongCount={wrongIds.length} hasSession={!!load(STORAGE.SESSION,null)} onResume={resumeSession} onStart={()=>setView('setup')} socialStatus={socialStatus} authMessage={authMessage} onYouTube={requestYouTubeSubscribe} onTikTok={openTikTok} onStartWrong={()=>startSession({mode:'wrong',area:'Semua',count:20,randomize:true})} setView={setView}/>} 
    {view==='setup' && <Setup setup={setup} setSetup={setSetup} wrongCount={wrongIds.length} onStart={()=>startSession()} onBack={()=>setView('dashboard')}/>} 
    {view==='exam' && session && <Exam session={session} setSession={updateSession} onFinish={finishSession} favorites={favorites} setFavorites={setFavorites}/>} 
    {view==='result' && lastAttempt && <Result attempt={lastAttempt} onDashboard={()=>setView('dashboard')} onWeak={(area)=>{setSetup({mode:'learn',area,count:20,randomize:true});setView('setup')}}/>}
    {view==='history' && <History attempts={attempts} setAttempts={setAttempts} onClearCloud={clearCloudHistory} cloud={AUTH_CONFIGURED} onBack={()=>setView('dashboard')}/>} 
    {view==='profile' && <Profile profile={profile} setProfile={setProfile} onBack={()=>setView('dashboard')}/>} 
  </div>
}

function Exam({session,setSession,onFinish,favorites,setFavorites}){
 const q=session.questions[session.current]; const answered=session.answers[session.current]; const isFlagged=session.flagged.includes(session.current); const revealed=!!session.reveal[session.current];
 // FIX V2.1: timer memakai functional update agar tick timer tidak menimpa jawaban/flag terbaru.
 useEffect(()=>{
   if(session.mode!=='tryout'||session.timeLeft===null) return;
   if(session.timeLeft<=0){onFinish();return;}
   const t=setTimeout(()=>setSession(prev=>prev?{...prev,timeLeft:Math.max(0,(prev.timeLeft??0)-1)}:prev),1000);
   return()=>clearTimeout(t);
 },[session.mode,session.timeLeft]);
 function answer(i){ setSession(prev=>{ if(!prev) return prev; const next={...prev,answers:{...prev.answers,[prev.current]:i}}; if(prev.mode==='learn') next.reveal={...prev.reveal,[prev.current]:true}; return next; }); }
 function toggleFlag(){setSession(prev=>{if(!prev)return prev;const flagged=prev.flagged.includes(prev.current)?prev.flagged.filter(x=>x!==prev.current):[...prev.flagged,prev.current];return {...prev,flagged};})}
 function nav(i){setSession(prev=>prev?{...prev,current:Math.max(0,Math.min(prev.questions.length-1,i)),tutorOpen:null}:prev)}
 function toggleFav(){ const exists=favorites.includes(q.id); setFavorites(exists?favorites.filter(x=>x!==q.id):[...favorites,q.id]); }
 const answeredCount=Object.keys(session.answers).length;
 return <div className="h-screen bg-slate-100 flex flex-col lg:flex-row overflow-hidden">
  <aside className="lg:w-80 bg-white border-r border-slate-200 flex flex-col max-h-[30vh] lg:max-h-none lg:h-screen no-print"><div className="p-5 bg-slate-900 text-white"><div className="font-black text-lg">UKOM NERS PRO AI</div><div className="text-xs text-slate-400 mt-1">{session.mode==='tryout'?'SIMULASI TRYOUT':session.mode==='wrong'?'REMEDIASI':'MODE BELAJAR'} · {answeredCount}/{session.questions.length}</div></div><div className="p-4 overflow-y-auto scrollbar flex-1"><div className="grid grid-cols-8 lg:grid-cols-5 gap-2">{session.questions.map((_,i)=>{const done=session.answers[i]!==undefined,flag=session.flagged.includes(i),active=i===session.current;return <button key={i} onClick={()=>nav(i)} className={`h-10 rounded-lg text-xs font-black border-2 relative ${active?'ring-2 ring-indigo-300 border-indigo-600':done?'bg-emerald-500 border-emerald-500 text-white':'bg-white border-slate-200 text-slate-500'}`}>{i+1}{flag&&<span className="absolute -top-1 -right-1 w-3 h-3 bg-amber-400 rounded-full"></span>}</button>})}</div></div><div className="p-4 border-t text-xs text-slate-500"><div className="flex gap-4"><span>🟢 Terjawab</span><span>🟡 Ragu</span></div></div></aside>
  <main className="flex-1 flex flex-col min-h-0"><div className="bg-white border-b border-slate-200 px-4 md:px-8 py-3 flex items-center justify-between gap-4 no-print"><div><div className="font-black">Soal {session.current+1} <span className="ml-2 px-2 py-1 rounded-md bg-slate-100 text-xs">{q.rumpun}</span></div><div className="text-xs text-slate-400">ID #{q.id} · Seed bank V2</div></div><div className="flex items-center gap-2">{session.mode==='tryout'&&<div className={`px-4 py-2 rounded-xl font-mono font-black ${session.timeLeft<600?'bg-rose-50 text-rose-600':'bg-slate-100'}`}>{fmtTime(session.timeLeft)}</div>}<button onClick={toggleFlag} className={`px-3 py-2 rounded-xl font-bold ${isFlagged?'bg-amber-100 text-amber-700':'bg-slate-100'}`}>⚑ {isFlagged?'Ragu':'Tandai'}</button><button onClick={()=>{ if(confirm('Akhiri sesi dan lihat hasil?')) onFinish(); }} className="px-4 py-2 bg-rose-500 text-white rounded-xl font-black">Selesai</button></div></div>
   <div className="flex-1 overflow-y-auto scrollbar p-4 md:p-8"><div className="max-w-4xl mx-auto"><div className="bg-white border border-slate-200 rounded-3xl p-6 md:p-8 shadow-sm"><p className="text-lg md:text-xl font-semibold leading-relaxed">{q.text}</p></div><div className="space-y-3 mt-5">{q.options.map((opt,i)=>{const selected=answered===i; const show=session.mode==='learn'&&revealed; const correct=show&&i===q.correctAnswer; const wrong=show&&selected&&!correct; return <button key={i} onClick={()=>answer(i)} disabled={show} className={`w-full text-left p-4 md:p-5 rounded-2xl border-2 flex gap-4 transition ${correct?'bg-emerald-50 border-emerald-500':wrong?'bg-rose-50 border-rose-400':selected?'bg-indigo-50 border-indigo-500':'bg-white border-slate-200 hover:border-indigo-300'}`}><span className={`w-9 h-9 shrink-0 rounded-xl grid place-items-center font-black ${selected?'bg-indigo-600 text-white':'bg-slate-100'}`}>{LETTERS[i]}</span><span className="font-semibold pt-1.5">{opt}</span></button>})}</div>
    {session.mode==='learn'&&revealed&&<LearningExplanation q={q} selected={answered} onTutor={()=>setSession(prev=>prev?{...prev,tutorOpen:prev.current}:prev)} tutorOpen={session.tutorOpen===session.current}/>} 
   </div></div>
   <div className="bg-white border-t px-4 md:px-8 py-4 flex justify-between items-center no-print"><button onClick={()=>nav(session.current-1)} disabled={session.current===0} className="px-5 py-3 rounded-xl bg-slate-100 font-bold disabled:opacity-40">← Sebelumnya</button><div className="hidden md:flex gap-2"><button onClick={toggleFav} className="px-4 py-3 rounded-xl bg-slate-100 font-bold">{favorites.includes(q.id)?'★ Tersimpan':'☆ Simpan Soal'}</button></div><button onClick={()=>nav(session.current+1)} disabled={session.current===session.questions.length-1} className="px-5 py-3 rounded-xl bg-indigo-600 text-white font-black disabled:opacity-40">Selanjutnya →</button></div>
  </main>
 </div>
}
function LearningExplanation({q,selected,onTutor,tutorOpen}){const ok=selected===q.correctAnswer;return <div className="mt-6 space-y-4"><div className={`rounded-2xl p-5 border ${ok?'bg-emerald-50 border-emerald-200':'bg-rose-50 border-rose-200'}`}><div className="font-black">{ok?'✓ Jawaban benar':'✕ Jawaban belum tepat'}</div><p className="text-sm mt-1">Kunci: {LETTERS[q.correctAnswer]}. Gunakan pembahasan untuk memahami alasan klinis, bukan sekadar menghafal opsi.</p></div><div className="bg-indigo-50 border border-indigo-100 rounded-2xl p-5"><h3 className="font-black text-indigo-900">Rasional & Analisis Distraktor</h3><div className="whitespace-pre-line text-sm leading-7 text-indigo-900/80 mt-3">{q.explanation}</div><button onClick={onTutor} className="mt-4 px-4 py-2.5 rounded-xl bg-indigo-600 text-white font-black">🤖 Tanya AI Tutor (demo)</button></div>{tutorOpen&&<TutorDemo q={q}/>}</div>}
function TutorDemo({q}){const key=q.text.split(/[,.?]/)[0].slice(0,120);return <div className="bg-slate-900 text-white rounded-2xl p-5"><div className="text-xs font-black text-indigo-300">SOCRATIC AI TUTOR · DEMO LOKAL</div><p className="mt-3 text-sm leading-6">Perhatikan kata kunci kasus: <b>“{key}...”</b>. Sebelum melihat kunci, tanyakan: masalah apa yang paling mengancam keselamatan pasien, dan prinsip prioritas apa yang digunakan? Setelah itu cocokkan alasan Anda dengan rasional di atas.</p><p className="text-xs text-slate-400 mt-3">Versi produksi dapat dihubungkan ke OpenAI/Gemini melalui backend. Jangan menaruh API key di browser.</p></div>}

function Result({attempt,onDashboard,onWeak}){
 const r=readiness(attempt.score); const rows=Object.entries(attempt.byArea).map(([area,v])=>({...v,area,pct:Math.round(100*v.correct/v.total)})).sort((a,b)=>a.pct-b.pct); const weakest=rows[0]?.area;
 return <main className="max-w-6xl mx-auto px-4 md:px-8 py-10"><div className="bg-slate-900 text-white rounded-[2rem] p-7 md:p-10"><div className="flex flex-col md:flex-row justify-between gap-8"><div><div className="text-sm text-indigo-300 font-black">HASIL ATTEMPT</div><div className="text-7xl font-black mt-2">{attempt.score}<span className="text-3xl">%</span></div><div className="font-black text-xl mt-3">{r.label}</div><p className="text-slate-300 mt-2 max-w-xl">{r.message}</p></div><div className="grid grid-cols-3 gap-3 md:w-[420px]"><Mini label="Benar" value={attempt.correct}/><Mini label="Salah" value={attempt.answered-attempt.correct}/><Mini label="Kosong" value={attempt.total-attempt.answered}/></div></div><div className="mt-7 text-xs text-slate-400 border-t border-white/10 pt-5">Skor/kategori pada aplikasi ini adalah evaluasi internal dan bukan keputusan kelulusan resmi UKOM Nasional.</div></div>
  <div className="grid lg:grid-cols-[.9fr,1.1fr] gap-6 mt-6"><div className="bg-white border border-slate-200 rounded-3xl p-6"><h2 className="text-xl font-black">Analisis Kelemahan</h2><div className="space-y-4 mt-5">{rows.map(x=><div key={x.area}><div className="flex justify-between text-sm font-bold"><span>{x.area}</span><span>{x.correct}/{x.total} · {x.pct}%</span></div><div className="h-2.5 bg-slate-100 rounded-full mt-2 overflow-hidden"><div className={`h-full ${x.pct>=75?'bg-emerald-500':x.pct>=60?'bg-amber-400':'bg-rose-500'}`} style={{width:x.pct+'%'}}></div></div></div>)}</div>{weakest&&<button onClick={()=>onWeak(weakest)} className="mt-6 w-full py-3 rounded-xl bg-indigo-600 text-white font-black">Latih 20 Soal {weakest}</button>}</div><div className="bg-white border border-slate-200 rounded-3xl p-6"><h2 className="text-xl font-black">Review Soal</h2><p className="text-sm text-slate-500 mt-1">Pembahasan lengkap ditampilkan setelah attempt selesai.</p><div className="mt-5 max-h-[600px] overflow-y-auto scrollbar space-y-5">{attempt.questions.map((q,i)=>{const a=attempt.answers[i],ok=a===q.correctAnswer;return <details key={i} className="border border-slate-200 rounded-2xl overflow-hidden"><summary className="cursor-pointer p-4 font-bold flex justify-between"><span>Soal {i+1} · {q.rumpun}</span><span className={ok?'text-emerald-600':'text-rose-600'}>{ok?'BENAR':a===undefined?'KOSONG':'SALAH'}</span></summary><div className="p-4 pt-0"><p className="font-semibold">{q.text}</p><div className="mt-3 text-sm">Jawaban Anda: <b>{a===undefined?'–':LETTERS[a]+'. '+q.options[a]}</b></div><div className="text-sm">Kunci: <b>{LETTERS[q.correctAnswer]}. {q.options[q.correctAnswer]}</b></div><div className="mt-4 whitespace-pre-line text-sm leading-6 bg-indigo-50 p-4 rounded-xl">{q.explanation}</div></div></details>})}</div></div></div>
  <div className="flex flex-wrap justify-center gap-3 mt-8 no-print"><button onClick={onDashboard} className="px-6 py-3 rounded-xl bg-slate-900 text-white font-black">Kembali ke Dashboard</button><button onClick={()=>window.print()} className="px-6 py-3 rounded-xl bg-white border border-slate-300 font-bold">Cetak / Simpan PDF</button></div>
 </main>
}
function Mini({label,value}){return <div className="bg-white/10 rounded-2xl p-4 text-center"><div className="text-3xl font-black">{value}</div><div className="text-xs text-slate-300 mt-1">{label}</div></div>}

function History({attempts,setAttempts,onClearCloud,cloud,onBack}){return <main className="max-w-5xl mx-auto px-4 py-10"><button onClick={onBack} className="font-bold text-slate-500">← Dashboard</button><div className="flex justify-between items-end mt-5"><div><h1 className="text-3xl font-black">Riwayat Perkembangan</h1><p className="text-slate-500 mt-1">{cloud?'Riwayat disinkronkan dengan Supabase dan dapat dibuka dari perangkat lain.':'Mode lokal: riwayat tersimpan pada browser.'}</p></div>{attempts.length>0&&<button onClick={()=>cloud?onClearCloud():setAttempts([])} className="text-sm text-rose-600 font-bold">Hapus riwayat</button>}</div><div className="mt-6 space-y-3">{attempts.length===0?<div className="bg-white rounded-2xl border p-8 text-center text-slate-500">Belum ada riwayat.</div>:attempts.map((a,i)=><div key={a.id||i} className="bg-white border border-slate-200 rounded-2xl p-5 flex items-center justify-between gap-4"><div><div className="font-black">{a.mode==='tryout'?'Simulasi Tryout':a.mode==='wrong'?'Remediasi':'Mode Belajar'}</div><div className="text-xs text-slate-400 mt-1">{new Date(a.createdAt).toLocaleString('id-ID')} · {a.correct}/{a.total} benar</div></div><div className="text-3xl font-black">{a.score}%</div></div>)}</div></main>}
function Profile({profile,setProfile,onBack}){return <main className="max-w-2xl mx-auto px-4 py-10"><button onClick={onBack} className="font-bold text-slate-500">← Dashboard</button><div className="bg-white border border-slate-200 rounded-3xl p-7 mt-5"><h1 className="text-2xl font-black">Profil Lokal</h1><p className="text-sm text-slate-500 mt-1">Pada produksi, bagian ini diganti dengan Supabase Auth / Google Login.</p><div className="space-y-5 mt-6"><label className="block"><span className="font-bold text-sm">Nama</span><input value={profile.name} onChange={e=>setProfile({...profile,name:e.target.value})} className="mt-2 w-full p-3.5 rounded-xl border border-slate-300"/></label><label className="block"><span className="font-bold text-sm">Institusi</span><input value={profile.institution} onChange={e=>setProfile({...profile,institution:e.target.value})} placeholder="Nama kampus" className="mt-2 w-full p-3.5 rounded-xl border border-slate-300"/></label><label className="block"><span className="font-bold text-sm">Target</span><input value={profile.target} onChange={e=>setProfile({...profile,target:e.target.value})} className="mt-2 w-full p-3.5 rounded-xl border border-slate-300"/></label></div><button onClick={onBack} className="mt-7 w-full py-3.5 rounded-xl bg-slate-900 text-white font-black">Simpan</button></div></main>}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
