<script type="text/babel">
const {useEffect,useMemo,useState}=React;
const APP_CONFIG={
  SUPABASE_URL:'https://rnvmaihjaxpvsgnaczod.supabase.co',
  SUPABASE_PUBLISHABLE_KEY:'sb_publishable_Ma5Bmh-wMjTWWGsBrLfOvA_mEsqleHA',
  PAYMENT_EDGE_FUNCTION:'create-midtrans-transaction',
  PROMO_PRICE:40000,
  NORMAL_PRICE:150000
};
const supabaseClient=window.supabase.createClient(APP_CONFIG.SUPABASE_URL,APP_CONFIG.SUPABASE_PUBLISHABLE_KEY);
const LETTERS=['A','B','C','D','E'];
const PROGRAM_AREAS={
  ners:['KMB','Maternitas','Anak','Jiwa','Keluarga','Gerontik','Manajemen','Gawat Darurat','Komunitas','Etik'],
  d3:['KMB','Maternitas','Anak','Jiwa','Keluarga','Gerontik','Manajemen','Gawat Darurat','Komunitas','Etik'],
  bidan:['Pranikah & Prakonsepsi','Kehamilan','Persalinan','Nifas & Menyusui','Neonatus/Bayi/Balita','KB & Kesehatan Reproduksi','Etik-Komunikasi-Manajemen']
};
function areasForProgram(p){return PROGRAM_AREAS[p]||PROGRAM_AREAS.ners}
const STORAGE={SESSION:'ukom_v4_active_session',FAVORITES:'ukom_v4_favorites'};
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function prepareQuestion(q,randomize=true){if(!randomize)return{...q,optionMap:[0,1,2,3,4]};const p=shuffle(q.options.map((text,originalIndex)=>({text,originalIndex})));return{...q,options:p.map(x=>x.text),optionMap:p.map(x=>x.originalIndex)}}
function fmtTime(sec){const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return `${h?String(h).padStart(2,'0')+':':''}${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function money(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n)}
function fmtDateID(v){if(!v)return'';try{return new Intl.DateTimeFormat('id-ID',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(v))}catch{return''}}
function readiness(s){if(s>=75)return{label:'Kesiapan Tinggi',tone:'emerald',message:'Pertahankan konsistensi dan fokuskan latihan pada area terlemah.'};if(s>=60)return{label:'Kesiapan Sedang',tone:'amber',message:'Dasar cukup, tetapi masih ada area yang perlu penguatan terarah.'};return{label:'Perlu Penguatan',tone:'rose',message:'Prioritaskan latihan per area dan ulangi soal yang masih salah.'}}
function programLabel(p){return p==='d3'?'D3 Keperawatan':p==='bidan'?'Profesi Bidan':'Profesi Ners'}

function App(){
 const [authUser,setAuthUser]=useState(null),[authLoading,setAuthLoading]=useState(true);
 const [profile,setProfile]=useState(null),[profileLoading,setProfileLoading]=useState(false);
 const [access,setAccess]=useState(null),[attempts,setAttempts]=useState([]),[wrongIds,setWrongIds]=useState([]),[favorites,setFavorites]=useState(()=>load(STORAGE.FAVORITES,[]));
 const [view,setView]=useState('dashboard'),[setup,setSetup]=useState({mode:'learn',area:'Semua',count:20,randomize:true});
 const [session,setSession]=useState(null),[lastAttempt,setLastAttempt]=useState(null),[message,setMessage]=useState(''),[paywall,setPaywall]=useState(false);
 useEffect(()=>save(STORAGE.FAVORITES,favorites),[favorites]);
 useEffect(()=>{let mounted=true;supabaseClient.auth.getSession().then(({data})=>{if(mounted){setAuthUser(data.session?.user||null);setAuthLoading(false)}});const {data:{subscription}}=supabaseClient.auth.onAuthStateChange((_e,s)=>{if(mounted){setAuthUser(s?.user||null);setAuthLoading(false)}});return()=>{mounted=false;subscription?.unsubscribe()}},[]);
 useEffect(()=>{if(authUser?.id)loadProfile();else{setProfile(null);setAccess(null);setAttempts([]);setWrongIds([])}},[authUser?.id]);
 useEffect(()=>{if(profile?.program){setSetup(prev=>({...prev,area:'Semua'}));setLastAttempt(null);localStorage.removeItem(STORAGE.SESSION);refreshAccess();loadCloudProgress(profile.program)}},[profile?.program]);

 async function googleLogin(){const {error}=await supabaseClient.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.origin+window.location.pathname}});if(error)setMessage(error.message)}
 async function signOut(){localStorage.removeItem(STORAGE.SESSION);setSession(null);setLastAttempt(null);await supabaseClient.auth.signOut();setView('dashboard')}
 async function loadProfile(){setProfileLoading(true);try{const {data,error}=await supabaseClient.from('profiles').select('*').eq('id',authUser.id).maybeSingle();if(error)throw error;setProfile(data||{id:authUser.id,full_name:authUser.user_metadata?.full_name||authUser.user_metadata?.name||'',email:authUser.email,institution:'',program:null,target_ukom:'2026',phone:''})}catch(e){setMessage('Profil belum dapat dimuat: '+e.message)}finally{setProfileLoading(false)}}
 async function saveProfile(form){const {data,error}=await supabaseClient.rpc('save_my_profile',{p_full_name:form.full_name,p_institution:form.institution,p_program:form.program,p_target_ukom:form.target_ukom||null,p_phone:form.phone||null});if(error)throw error;await loadProfile();return data}
 async function refreshAccess(){if(!authUser?.id)return;const {data,error}=await supabaseClient.rpc('get_my_access');if(error){setMessage('Status akses gagal dimuat: '+error.message);return}setAccess(data)}
 async function loadCloudProgress(program){try{const {data:rows,error}=await supabaseClient.from('attempts').select('id,mode,started_at,finished_at,score,total_questions,metadata').eq('user_id',authUser.id).order('finished_at',{ascending:false}).limit(100);if(error)throw error;const programRows=(rows||[]).filter(r=>(r.metadata?.program||'ners')===program);const ats=programRows.map(r=>({id:r.id,mode:r.mode,startedAt:r.started_at,createdAt:r.finished_at||r.started_at,score:Number(r.score||0),total:Number(r.total_questions||0),correct:Number(r.metadata?.correct||0),answered:Number(r.metadata?.answered||0),byArea:r.metadata?.byArea||{},wrongIds:r.metadata?.wrongIds||[]}));setAttempts(ats);const ids=new Set(programRows.map(r=>r.id));if(!ids.size){setWrongIds([]);return}const {data:ans}=await supabaseClient.from('attempt_answers').select('attempt_id,question_id,is_correct,answered_at').in('attempt_id',[...ids]).order('answered_at',{ascending:true});const wrong=new Set();(ans||[]).forEach(r=>{if(r.is_correct===true)wrong.delete(Number(r.question_id));else if(r.is_correct===false)wrong.add(Number(r.question_id))});setWrongIds([...wrong])}catch(e){setMessage('Riwayat belum dapat dimuat: '+e.message)}}
 function updateSession(fn){setSession(prev=>{const next=typeof fn==='function'?fn(prev):fn;if(next)save(STORAGE.SESSION,next);return next})}
 async function startSession(cfg){const mode=cfg.mode;if(mode!=='trial'&&!access?.premium){setPaywall(true);return}if(mode==='trial'&&access?.trial_used){setMessage('Trial 20 soal untuk program ini sudah pernah digunakan.');return}if(mode==='wrong'&&!wrongIds.length){setMessage('Belum ada soal salah untuk diremediasi.');return}const count=mode==='tryout'?180:mode==='trial'?20:Math.min(Number(cfg.count)||20,180);setMessage('Mengambil soal dari Supabase…');const {data,error}=await supabaseClient.rpc('get_exam_questions',{p_limit:count,p_area:mode==='wrong'||cfg.area==='Semua'?null:cfg.area,p_ids:mode==='wrong'?wrongIds:null,p_mode:mode});if(error){if(String(error.message).includes('PREMIUM_REQUIRED'))setPaywall(true);else setMessage('Gagal mengambil soal: '+error.message);return}const qs=(data||[]).map(row=>prepareQuestion({id:Number(row.id),rumpun:row.area,subtopic:row.subtopic||'',text:row.vignette,options:[row.option_a,row.option_b,row.option_c,row.option_d,row.option_e],difficulty:row.difficulty,cognitiveLevel:row.cognitive_level,blueprintTag:row.blueprint_tag},cfg.randomize!==false));if(!qs.length){setMessage('Belum ada soal aktif untuk pilihan ini.');return}const s={mode,area:cfg.area,questions:qs,answers:{},flagged:[],current:0,startedAt:new Date().toISOString(),timeLeft:(mode==='tryout'?qs.length*60:null)};setSession(s);save(STORAGE.SESSION,s);setView('exam');setMessage('')}
 async function finishSession(){if(!session)return;try{setMessage('Menghitung hasil secara aman di Supabase…');const payload=session.questions.map((q,i)=>({question_id:Number(q.id),selected_option:session.answers[i]===undefined?null:Number((q.optionMap||[0,1,2,3,4])[session.answers[i]]),is_flagged:session.flagged.includes(i)}));const {data,error}=await supabaseClient.rpc('submit_ukom_attempt',{p_mode:session.mode,p_started_at:session.startedAt,p_answers:payload});if(error)throw error;const reviewMap=new Map((data.review||[]).map(r=>[Number(r.question_id),r]));const reviewQuestions=session.questions.map(q=>{const r=reviewMap.get(Number(q.id))||{};const originalCorrect=Number(r.correct_option);return{...q,correctAnswer:(q.optionMap||[0,1,2,3,4]).indexOf(originalCorrect),explanation:r.explanation||'Pembahasan belum tersedia.'}});const a={id:data.attempt_id,program:data.program,createdAt:data.finished_at,startedAt:session.startedAt,mode:session.mode,score:Number(data.score||0),correct:Number(data.correct||0),answered:Number(data.answered||0),total:Number(data.total||session.questions.length),byArea:data.byArea||{},wrongIds:(data.wrongIds||[]).map(Number),questions:reviewQuestions,answers:session.answers,flagged:session.flagged};localStorage.removeItem(STORAGE.SESSION);setSession(null);setLastAttempt(a);await refreshAccess();await loadCloudProgress(profile.program);setView('result');setMessage('')}catch(e){setMessage('Submit gagal: '+e.message)}}
 async function checkout(){try{setMessage('Membuat transaksi pembayaran…');const {data,error}=await supabaseClient.functions.invoke(APP_CONFIG.PAYMENT_EDGE_FUNCTION,{body:{program:profile.program,plan:'launch_30'}});if(error)throw error;if(data?.redirect_url){window.open(data.redirect_url,'_blank','noopener,noreferrer');setMessage('Halaman pembayaran dibuka. Setelah pembayaran berhasil, kembali ke aplikasi lalu klik Cek Status Akses.')}else throw new Error(data?.error||'redirect_url tidak diterima')}catch(e){console.error('Checkout error',e);setMessage('Pembayaran belum dapat diproses. Silakan coba kembali beberapa saat lagi.')} }

 if(authLoading)return <Splash/>;
 if(!authUser)return <Marketing onLogin={googleLogin}/>;
 if(profileLoading||!profile)return <Splash text="Memuat profil mahasiswa…"/>;
 const complete=profile.full_name&&profile.institution&&['ners','d3','bidan'].includes(profile.program);
 if(!complete)return <Onboarding initial={profile} user={authUser} onSave={saveProfile}/>;
 const latest=attempts[0],avg=attempts.length?(attempts.reduce((a,b)=>a+b.score,0)/attempts.length).toFixed(1):0,best=attempts.length?Math.max(...attempts.map(a=>a.score)):0;
 const currentAreas=areasForProgram(profile.program);const aggregate={};currentAreas.forEach(a=>aggregate[a]={correct:0,total:0});attempts.slice(0,10).forEach(at=>Object.entries(at.byArea||{}).forEach(([a,v])=>{aggregate[a]||={correct:0,total:0};aggregate[a].correct+=v.correct;aggregate[a].total+=v.total}));
 const weakest=Object.entries(aggregate).filter(([,v])=>v.total>0).sort((a,b)=>(a[1].correct/a[1].total)-(b[1].correct/b[1].total))[0]?.[0];
 return <div className="min-h-screen">{view!=='exam'&&<TopNav profile={profile} access={access} setView={setView} onSignOut={signOut}/>} {view==='dashboard'&&<Dashboard profile={profile} access={access} attempts={attempts} latest={latest} avg={avg} best={best} aggregate={aggregate} weakest={weakest} wrongCount={wrongIds.length} message={message} onTrial={()=>startSession({mode:'trial',area:'Semua',count:20,randomize:true})} onPremium={()=>setView('setup')} onWrong={()=>startSession({mode:'wrong',area:'Semua',count:20,randomize:true})} onPricing={()=>setPaywall(true)} onRefresh={async()=>{await refreshAccess();await loadCloudProgress(profile.program)}} setView={setView}/>} {view==='setup'&&<Setup setup={setup} setSetup={setSetup} areas={currentAreas} premium={access?.premium} wrongCount={wrongIds.length} onStart={()=>startSession(setup)} onBack={()=>setView('dashboard')} onPricing={()=>setPaywall(true)}/>} {view==='exam'&&session&&<Exam session={session} setSession={updateSession} onFinish={finishSession} favorites={favorites} setFavorites={setFavorites}/>} {view==='result'&&lastAttempt&&<Result attempt={lastAttempt} onDashboard={()=>setView('dashboard')} onWeak={a=>{setSetup({mode:'learn',area:a,count:20,randomize:true});setView('setup')}}/>} {view==='history'&&<History attempts={attempts} onBack={()=>setView('dashboard')}/>} {view==='profile'&&<Profile profile={profile} onSave={async f=>{await saveProfile(f);setView('dashboard')}} onBack={()=>setView('dashboard')}/>} {view==='help'&&<Help onBack={()=>setView('dashboard')}/>} {paywall&&<Pricing onClose={()=>setPaywall(false)} onCheckout={checkout} onRefresh={refreshAccess} program={profile.program} message={message}/>}</div>
}

function Splash({text='Memuat UKOM Health Pro…'}){return <div className="min-h-screen grid place-items-center bg-gradient-to-br from-sky-50 to-blue-100 text-slate-900"><div className="text-center"><div className="w-16 h-16 rounded-2xl bg-gradient-to-br from-sky-400 to-blue-600 text-white grid place-items-center font-black text-2xl mx-auto shadow-xl shadow-sky-200">H+</div><div className="font-black mt-4">{text}</div></div></div>}
function Marketing({onLogin}){const faqs=[
['Apakah saya harus langsung membeli Premium?','Tidak. Pengguna baru dapat mencoba Trial 20 soal terlebih dahulu. Trial tersedia satu kali untuk setiap program yang dipilih.'],
['Apa perbedaan Trial, Latihan, dan Simulasi?','Trial berisi 20 soal gratis. Setelah Premium aktif, Latihan dapat difokuskan per area, sedangkan Simulasi menggunakan 180 soal dengan waktu 180 menit.'],
['Apakah akses Premium berlaku untuk semua program?','Tidak. Akses Premium berlaku per program selama 30 hari. Program Profesi Ners, D3 Keperawatan, dan Profesi Bidan memiliki bank soal masing-masing.'],
['Bagaimana pembayaran diaktifkan?','Klik Buka Premium, selesaikan pembayaran melalui halaman Midtrans, lalu kembali ke aplikasi dan pilih Cek Status Akses. Akses aktif otomatis setelah pembayaran terverifikasi.'],
['Kapan pembahasan jawaban muncul?','Kunci dan pembahasan A–E baru ditampilkan setelah sesi selesai dan jawaban berhasil disimpan. Ini membantu menjaga integritas latihan.'],

)} className="mt-2 w-full p-3.5 border rounded-xl bg-white">{[10,20,30,50].map(n=><option key={n} value={n}>{n} soal</option>)}</select></label>}</div>}<label className="mt-5 flex gap-3 p-4 rounded-xl bg-slate-50"><input type="checkbox" checked={setup.randomize} onChange={e=>setSetup({...setup,randomize:e.target.checked})}/><span className="font-bold">Randomisasi pilihan jawaban</span></label><button onClick={onStart} className="mt-7 w-full py-4 rounded-xl bg-indigo-600 text-white font-black">Mulai</button></div></main>}
function Exam({session,setSession,onFinish,favorites,setFavorites}){const q=session.questions[session.current],answered=session.answers[session.current],flag=session.flagged.includes(session.current);useEffect(()=>{if(session.mode!=='tryout'||session.timeLeft===null)return;const id=setInterval(()=>setSession(prev=>({...prev,timeLeft:Math.max(0,(prev.timeLeft||0)-1)})),1000);return()=>clearInterval(id)},[session.mode]);useEffect(()=>{if(session.mode==='tryout'&&session.timeLeft===0)onFinish()},[session.timeLeft]);function answer(i){setSession(p=>({...p,answers:{...p.answers,[p.current]:i}}))}function toggleFlag(){setSession(s=>({...s,flagged:s.flagged.includes(s.current)?s.flagged.filter(x=>x!==s.current):[...s.flagged,s.current]}))}function toggleFav(){setFavorites(x=>x.includes(q.id)?x.filter(id=>id!==q.id):[...x,q.id])}const done=Object.keys(session.answers).length,progress=Math.round((done/session.questions.length)*100);return <div className="exam-shell h-screen bg-sky-50 flex flex-col lg:flex-row overflow-hidden"><aside className="exam-sidebar lg:w-80 bg-white border-r border-sky-100 flex flex-col lg:h-screen no-print"><div className="exam-brandbar p-5 bg-gradient-to-r from-sky-600 to-blue-700 text-white"><div className="flex items-center justify-between"><div><div className="font-black">UKOM HEALTH PRO</div><div className="text-xs text-sky-100 mt-1">{session.mode.toUpperCase()} · {done}/{session.questions.length} terjawab</div></div><div className="lg:hidden text-xs font-black bg-white/15 px-2.5 py-1.5 rounded-lg">{progress}%</div></div><div className="h-1.5 bg-white/20 rounded-full mt-3 overflow-hidden"><div className="h-full bg-white rounded-full transition-all" style={{width:progress+'%'}}></div></div></div><div className="exam-question-strip p-4 overflow-y-auto scrollbar flex-1"><div className="exam-question-grid grid grid-cols-8 lg:grid-cols-5 gap-2">{session.questions.map((_,i)=>{const a=session.answers[i]!==undefined,f=session.flagged.includes(i),active=i===session.current;return <button key={i} onClick={()=>setSession(s=>({...s,current:i}))} className={`h-10 rounded-lg text-xs font-black border-2 relative shrink-0 ${active?'ring-2 ring-sky-200 border-sky-500 bg-sky-50 text-sky-700':a?'bg-emerald-500 border-emerald-500 text-white':'bg-white border-slate-200'}`}>{i+1}{f&&<span className="absolute -top-1 -right-1 w-3 h-3 bg-amber-400 rounded-full"/>}</button>})}</div></div></aside><main className="flex-1 flex flex-col min-h-0 bg-sky-50"><div className="exam-main-header bg-white border-b border-sky-100 px-4 md:px-8 py-3 flex items-center justify-between no-print"><div className="min-w-0"><div className="font-black flex items-center"><span>Soal {session.current+1}</span><span className="exam-area ml-2 px-2 py-1 rounded-lg bg-sky-50 text-sky-700 text-xs">{q.rumpun}</span></div><div className="exam-id text-xs text-slate-400">ID #{q.id}</div></div><div className="exam-actions flex gap-2 items-center shrink-0">{session.mode==='tryout'&&<div className="exam-timer px-4 py-2 rounded-xl bg-sky-50 text-sky-700 font-mono font-black">{fmtTime(session.timeLeft)}</div>}<button onClick={toggleFlag} className={`px-3 py-2 rounded-xl font-bold ${flag?'bg-amber-100 text-amber-700':'bg-slate-100'}`}>⚑ <span className="hidden sm:inline">{flag?'Ragu':'Tandai'}</span></button><button onClick={()=>confirm('Akhiri sesi dan lihat hasil?')&&onFinish()} className="px-4 py-2 rounded-xl bg-rose-500 text-white font-black">Selesai</button></div></div><div className="exam-scroll flex-1 overflow-y-auto p-4 md:p-8 scrollbar"><div className="max-w-4xl mx-auto"><div className="exam-stem mobile-app-card bg-white border border-sky-100 rounded-3xl p-6 md:p-8 shadow-sm"><p className="text-lg md:text-xl font-semibold leading-relaxed">{q.text}</p></div><div className="space-y-3 mt-4 md:mt-5">{q.options.map((o,i)=><button key={i} onClick={()=>answer(i)} className={`exam-option w-full text-left p-4 md:p-5 rounded-2xl border-2 flex gap-3 md:gap-4 transition active:scale-[.995] ${answered===i?'border-sky-500 bg-sky-50 shadow-sm':'border-slate-200 bg-white hover:border-sky-200'}`}><span className={`letter w-9 h-9 rounded-xl grid place-items-center font-black shrink-0 ${answered===i?'bg-sky-500 text-white':'bg-slate-100 text-slate-700'}`}>{LETTERS[i]}</span><span className="option-text font-semibold pt-1.5">{o}</span></button>)}</div></div></div><div className="exam-bottom mobile-safe-bottom bg-white border-t border-sky-100 px-4 md:px-8 py-4 flex justify-between no-print"><button onClick={()=>setSession(s=>({...s,current:Math.max(0,s.current-1)}))} disabled={session.current===0} className="px-5 py-3 rounded-xl bg-slate-100 font-bold disabled:opacity-40">← Sebelumnya</button><button onClick={toggleFav} className="hidden md:block px-4 py-3 rounded-xl bg-sky-50 text-sky-700 font-bold">{favorites.includes(q.id)?'★ Tersimpan':'☆ Simpan'}</button><button onClick={()=>setSession(s=>({...s,current:Math.min(s.questions.length-1,s.current+1)}))} disabled={session.current===session.questions.length-1} className="px-5 py-3 rounded-xl bg-sky-500 text-white font-black disabled:opacity-40">Selanjutnya →</button></div></main></div>}
function Result({attempt,onDashboard,onWeak}){const r=readiness(attempt.score),rows=Object.entries(attempt.byArea||{}).map(([area,v])=>({...v,area,pct:Math.round(100*v.correct/v.total)})).sort((a,b)=>a.pct-b.pct),weak=rows[0]?.area;return <main className="max-w-6xl mx-auto px-4 md:px-8 py-10"><div className="rounded-[2rem] bg-slate-950 text-white p-8"><div className="text-sm text-cyan-300 font-black">HASIL {programLabel(attempt.program)}</div><div className="text-7xl font-black mt-2">{attempt.score}<span className="text-3xl">%</span></div><div className="text-xl font-black mt-3">{r.label}</div><div className="grid grid-cols-3 gap-3 max-w-md mt-7"><Mini label="Benar" value={attempt.correct}/><Mini label="Salah" value={attempt.answered-attempt.correct}/><Mini label="Kosong" value={attempt.total-attempt.answered}/></div></div><div className="grid lg:grid-cols-[.8fr,1.2fr] gap-6 mt-6"><div className="bg-white border rounded-3xl p-6"><h2 className="text-xl font-black">Analisis Area</h2><div className="space-y-4 mt-5">{rows.map(x=><div key={x.area}><div className="flex justify-between text-sm font-bold"><span>{x.area}</span><span>{x.pct}%</span></div><div className="h-2.5 bg-slate-100 rounded-full mt-2"><div className={`${x.pct>=75?'bg-emerald-500':x.pct>=60?'bg-amber-400':'bg-rose-500'} h-full rounded-full`} style={{width:x.pct+'%'}}/></div></div>)}</div>{weak&&<button onClick={()=>onWeak(weak)} className="mt-6 w-full py-3 rounded-xl bg-indigo-600 text-white font-black">Latih 20 Soal {weak}</button>}</div><div className="bg-white border rounded-3xl p-6"><h2 className="text-xl font-black">Review & Rasional</h2><p className="text-sm text-slate-500">Kunci dan pembahasan baru diterima setelah attempt tersimpan.</p><div className="mt-5 max-h-[650px] overflow-y-auto scrollbar space-y-4">{attempt.questions.map((q,i)=>{const a=attempt.answers[i],ok=a===q.correctAnswer;return <details key={i} className="border rounded-2xl overflow-hidden"><summary className="p-4 cursor-pointer font-bold flex justify-between"><span>Soal {i+1} · {q.rumpun}</span><span className={ok?'text-emerald-600':'text-rose-600'}>{ok?'BENAR':a===undefined?'KOSONG':'SALAH'}</span></summary><div className="p-4 pt-0"><p className="font-semibold leading-6">{q.text}</p><div className="text-sm mt-3">Jawaban Anda: <b>{a===undefined?'–':LETTERS[a]+'. '+q.options[a]}</b></div><div className="text-sm">Kunci: <b>{LETTERS[q.correctAnswer]}. {q.options[q.correctAnswer]}</b></div><div className="mt-4 p-4 rounded-xl bg-indigo-50 text-sm leading-6 whitespace-pre-line">{q.explanation}</div></div></details>})}</div></div></div><button onClick={onDashboard} className="mt-8 px-6 py-3 rounded-xl bg-slate-900 text-white font-black no-print">Kembali ke Dashboard</button></main>}
function Mini({label,value}){return <div className="rounded-2xl bg-white/10 p-4 text-center"><div className="text-3xl font-black">{value}</div><div className="text-xs text-slate-300">{label}</div></div>}
function History({attempts,onBack}){return <main className="max-w-5xl mx-auto px-4 py-10"><button onClick={onBack} className="font-bold text-slate-500">← Dashboard</button><h1 className="text-3xl font-black mt-5">Riwayat Perkembangan</h1><div className="space-y-3 mt-6">{attempts.length?attempts.map(a=><div key={a.id} className="bg-white border rounded-2xl p-5 flex justify-between"><div><div className="font-black">{a.mode==='trial'?'Trial Gratis':a.mode==='tryout'?'Simulasi 180':'Latihan'}</div><div className="text-xs text-slate-400">{new Date(a.createdAt).toLocaleString('id-ID')} · {a.correct}/{a.total} benar</div></div><div className="text-3xl font-black">{a.score}%</div></div>):<div className="bg-white border rounded-2xl p-8 text-slate-500 text-center">Belum ada riwayat.</div>}</div></main>}
function Profile({profile,onSave,onBack}){const [f,setF]=useState({...profile}),[busy,setBusy]=useState(false),[err,setErr]=useState('');async function submit(){setBusy(true);try{await onSave(f)}catch(e){setErr(e.message)}finally{setBusy(false)}}return <main className="max-w-2xl mx-auto px-4 py-10"><button onClick={onBack} className="font-bold text-slate-500">← Dashboard</button><div className="bg-white border rounded-3xl p-7 mt-5"><h1 className="text-2xl font-black">Profil Mahasiswa</h1><div className="space-y-5 mt-6"><Field label="Nama lengkap" value={f.full_name} onChange={v=>setF({...f,full_name:v})}/><Field label="Institusi" value={f.institution} onChange={v=>setF({...f,institution:v})}/><label className="block"><span className="text-sm font-black">Program</span><select value={f.program} onChange={e=>setF({...f,program:e.target.value})} className="mt-2 w-full p-3.5 border rounded-xl bg-white"><option value="ners">Profesi Ners</option><option value="d3">D3 Keperawatan</option><option value="bidan">Profesi Bidan</option></select><div className="text-xs text-amber-600 mt-2">Akses premium berlaku per program. Mengganti program akan mengubah bank soal dashboard.</div></label><Field label="Target UKOM" value={f.target_ukom||''} onChange={v=>setF({...f,target_ukom:v})}/></div>{err&&<div className="mt-4 text-rose-600 text-sm">{err}</div>}<button onClick={submit} disabled={busy} className="mt-7 w-full py-3.5 rounded-xl bg-slate-900 text-white font-black">{busy?'Menyimpan…':'Simpan Perubahan'}</button></div></main>}
function Help({onBack}){const faqs=[
['Bagaimana memulai latihan?','Dari Dashboard pilih Trial 20 soal jika masih tersedia. Setelah Premium aktif, pilih Mulai Latihan / Tryout dan tentukan mode serta area.'],
['Apakah jawaban bisa diubah?','Bisa. Selama sesi belum diselesaikan, Anda dapat berpindah soal dan mengganti pilihan jawaban.'],
['Apa fungsi Tandai/Ragu?','Gunakan Tandai untuk soal yang ingin diperiksa lagi sebelum submit. Titik kuning pada nomor soal menunjukkan soal yang ditandai.'],
['Mengapa kunci tidak muncul saat mengerjakan?','Kunci dan pembahasan disimpan di server dan baru diberikan setelah attempt selesai agar latihan tidak membocorkan jawaban.'],
['Bagaimana Premium aktif setelah membayar?','Setelah pembayaran Midtrans selesai, kembali ke aplikasi lalu tekan Cek Status Akses. Bila settlement sudah diterima, Premium aktif otomatis.'],
['Apakah progres tersimpan?','Attempt yang sudah disubmit tersimpan pada akun dan dapat dilihat di Riwayat. Sesi aktif juga disimpan secara lokal pada perangkat selama belum disubmit.']
];return <main className="max-w-5xl mx-auto px-4 md:px-8 py-8 md:py-10"><button onClick={onBack} className="font-bold text-sky-700">← Kembali ke Dashboard</button><div className="mt-5 rounded-[2rem] bg-gradient-to-br from-sky-500 to-blue-700 text-white p-7 md:p-10"><div className="text-xs font-black text-sky-100">PANDUAN PENGGUNA</div><h1 className="text-3xl md:text-5xl font-black mt-2">Cara menggunakan UKOM Health Pro</h1><p className="text-sky-50 mt-3 max-w-2xl leading-7">Gunakan alur sederhana ini: pilih program → mulai trial/latihan → kerjakan dan tandai soal ragu → submit → pelajari analitik dan pembahasan.</p></div><div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-6">{[['1','Pilih mode','Trial, latihan per area, remediasi soal salah, atau Simulasi 180 soal.'],['2','Kerjakan','Baca vignette, pilih A–E, gunakan Tandai bila ingin kembali.'],['3','Submit','Tekan Selesai setelah yakin. Skor dihitung secara server-side.'],['4','Evaluasi','Pelajari skor, area lemah, dan pembahasan sebelum latihan berikutnya.']].map(([n,t,d])=><div key={n} className="mobile-app-card bg-white border border-sky-100 rounded-3xl p-5 shadow-sm"><div className="w-9 h-9 bg-sky-100 text-sky-700 rounded-xl grid place-items-center font-black">{n}</div><div className="font-black mt-4">{t}</div><div className="text-sm text-slate-500 leading-6 mt-2">{d}</div></div>)}</div><h2 className="text-2xl font-black mt-9">FAQ</h2><div className="space-y-3 mt-4">{faqs.map(([q,a],i)=><details key={i} className="rounded-2xl border border-sky-100 bg-white p-5 shadow-sm"><summary className="cursor-pointer font-black">{q}</summary><p className="text-slate-600 leading-7 mt-3">{a}</p></details>)}</div></main>}
function Pricing({onClose,onCheckout,onRefresh,program,message}){return <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm grid place-items-center p-4"><div className="w-full max-w-lg bg-white rounded-[2rem] p-7 md:p-9 relative"><button onClick={onClose} className="absolute right-5 top-5 w-9 h-9 rounded-full bg-slate-100">×</button><div className="text-xs font-black text-indigo-600">PROMO LAUNCHING</div><h2 className="text-3xl font-black mt-2">Aktifkan {programLabel(program)}</h2><p className="text-slate-500 mt-2">Akses premium 30 hari: simulasi 180 soal, latihan per area, remediasi, pembahasan lengkap, dan analitik.</p><div className="mt-6 p-5 rounded-2xl bg-slate-950 text-white text-center"><div className="line-through text-slate-400">{money(APP_CONFIG.NORMAL_PRICE)}</div><div className="text-5xl font-black">{money(APP_CONFIG.PROMO_PRICE)}</div></div><div className="mt-5 p-3 rounded-xl bg-slate-50 text-center text-sm font-bold text-slate-600">Metode pembayaran ditampilkan langsung oleh Midtrans sesuai metode yang aktif pada merchant.</div><button onClick={onCheckout} className="mt-5 w-full py-4 rounded-xl bg-gradient-to-r from-sky-500 to-blue-600 text-white font-black">Bayar & Aktifkan</button><button onClick={onRefresh} className="mt-3 w-full py-3 rounded-xl bg-slate-100 font-bold">Saya Sudah Bayar — Cek Status</button>{message&&<div className="mt-4 p-3 rounded-xl bg-slate-50 text-xs text-slate-600">{message}</div>}<p className="text-[11px] text-slate-400 mt-4">Pembayaran diproses melalui Midtrans. Akses Premium akan aktif otomatis setelah pembayaran terverifikasi.</p></div></div>}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
